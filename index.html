<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot de Orçamento de Pintura</title>
    <!-- CSS principal do projeto -->
    <link rel="stylesheet" href="style.css">
    <!-- Adicionando fontes modernas do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="chat-container">
        <!-- Cabeçalho do Chat -->
        <header class="chat-header">
            <h2>Assistente de Orçamento</h2>
            <p>Empresa de Pinturas Especializadas</p>
        </header>

        <!-- Área de visualização das mensagens -->
        <section class="chat-messages" id="chat-messages">
            <div class="message bot">
                <div class="bubble">
                    Olá! Sou o assistente virtual da empresa de pinturas. Gostaria de solicitar um orçamento rápido e sem compromisso? Para começar, como você se chama?
                </div>
            </div>
        </section>

        <!-- Área de envio de mensagens -->
        <footer class="chat-input-area">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Digite sua resposta aqui..." 
                autocomplete="off"
                aria-label="Mensagem"
            >
            <button id="send-button" aria-label="Enviar mensagem">
                Enviar
            </button>
        </footer>
    </main>

    <!-- Script com a lógica do Chat -->
    <script src="script.js"></script>
</body>
</html>
